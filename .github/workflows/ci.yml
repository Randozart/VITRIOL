name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - libvitriol
          - vitriol-cache
          - vitriol-governor
          - vitriol-stream
          - vitriol-tui
          - libhermes
          - officina/tui
          - demiurge
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }} -> target
      - name: fmt
        run: cargo fmt --check
      - name: clippy (advisory)
        continue-on-error: true
        run: cargo clippy --locked --all-targets
      - name: test
        run: cargo test --locked

  node:
    name: node (officina)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: officina
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: officina/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff
      - name: ruff (syntax/undefined names only)
        run: ruff check --select E9,F63,F7,F82 scripts tests libvitriol
      - name: compileall
        run: python -m compileall -q scripts tests libvitriol

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck --severity=error scripts/*.sh

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: docs lint (core docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes markdownlint-cli2@latest CONTRIBUTING.md SECURITY.md CHANGELOG.md
