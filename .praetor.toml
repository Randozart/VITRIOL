# VITRIOL Praetor configuration.
# 2026-08-06: intent-comment check disabled. Praetor's intent rule does not
# recognize Python `#` comments as satisfying the requirement (verified with a
# minimal comment+def test file), so every function in a new Python file fails
# validation regardless of correct comment placement. The rule is unusable for
# this repo's Python tooling; disabled per maintainer decision. Other checks
# (complexity, datalog, Big-O) remain active.

[intent]
enabled = false
