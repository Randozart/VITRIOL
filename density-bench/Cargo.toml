[package]
name = "density-bench"
version = "0.1.0"
edition = "2021"
description = "Token-density benchmark: measures whether constrained output actually costs fewer tokens on the lanes we consume"

[[bin]]
name = "density-bench"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
