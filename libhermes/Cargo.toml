[package]
name = "libhermes"
version = "0.1.0"
edition = "2021"

[lib]
name = "libhermes"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
