[package]
name = "officina-tui"
version = "0.1.4"
edition = "2021"
description = "Ratatui TUI for Officina — replaces pi-tui, communicates with pi-coding-agent via JSONL RPC"

[[bin]]
name = "officina"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
reqwest = { version = "0.13", features = ["json"] }
anyhow = "1"
futures-lite = "2"
pulldown-cmark = "0.13"
clap = { version = "4", features = ["derive"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
base64 = "0.22"
