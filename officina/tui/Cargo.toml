[package]
name = "officina-tui"
version = "0.1.0"
edition = "2021"
description = "Ratatui TUI for Officina — replaces pi-tui, communicates with pi-coding-agent via JSONL RPC"

[[bin]]
name = "officina"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
futures-lite = "2"
pulldown-cmark = "0.12"
clap = { version = "4", features = ["derive"] }
