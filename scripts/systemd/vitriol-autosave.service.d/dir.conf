# Stage under scripts/systemd/, install with scripts/install-vitriol-dropins.sh.
# The autosave sidecar defaulted to ~/.vitriol/checkpoints while the engine
# mirror lives in /scratch/kvtier (config slot_save_path) - the sidecar has
# never written to the real mirror dir.
[Service]
Environment=VITRIOL_SLOT_SAVE_DIR=/scratch/kvtier
