# System service override for the Z440 Kintsugi launcher.
[Service]
Type=exec
ExecStartPre=
ExecStart=
ExecStart=/home/randozart/Desktop/Projects/VITRIOL/scripts/serve-kintsugi.sh
Environment=VITRIOL_KINTSUGI_GPU=1
Environment=VITRIOL_KINTSUGI_SLOT_DIR=/var/lib/vitriol-kintsugi
StateDirectory=vitriol-kintsugi
StateDirectoryMode=0700
