# Stage under scripts/systemd/, install with scripts/install-vitriol-dropins.sh.
# Defensive pin: VITRIOL_KV_DISK_PRUNE=1 deletes unverified mirror states at
# boot (model-file mtime/size touch counts as unverified). Default is already
# 0 in the engine; pin it so a config drift cannot wipe the Optane mirror.
[Service]
Environment=VITRIOL_KV_DISK_PRUNE=0
