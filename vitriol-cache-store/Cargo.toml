[package]
name = "vitriol-cache-store"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Engine-owned durable KV snapshot publication and bounded retirement"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vitriol-core = { path = "../vitriol-core" }
