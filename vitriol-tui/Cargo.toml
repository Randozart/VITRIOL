[package]
name = "vitriol-tui"
version = "0.1.0"
edition = "2021"
description = "VITRIOL terminal operations dashboard — Ratatui, Vitriolum theme"

[[bin]]
name = "vitriol-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
ureq = { version = "3", features = ["json"] }
serde_json = "1"

[profile.release]
lto = "thin"
opt-level = 2
