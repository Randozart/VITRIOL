[package]
name = "vitriol-tui"
version = "0.1.0"
edition = "2021"
description = "VITRIOL terminal operations dashboard — Ratatui, Vitriolum theme"

[[bin]]
name = "vitriol-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"

[profile.release]
lto = "thin"
opt-level = 2
